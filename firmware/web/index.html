<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Lava Lamp</title>
  <style>
    :root {
      --bg: #121316;
      --card: #1c1d22;
      --border: #2e3039;
      --primary: #ff5e3a;
      --primary-glow: rgba(255, 94, 58, 0.3);
      --accent: #ffa600;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --danger: #ff4444;
      --success: #00e676;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .header { display: flex; justify-content: space-between; align-items: center; }
    .title { font-size: 1.25rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; background: #333; color: #ccc; }
    .badge.OFF { background: #333; color: #888; }
    .badge.HEATING { background: #d97706; color: #fff; }
    .badge.WARMING { background: #d97706; color: #fff; }
    .badge.HOLDING { background: #16a34a; color: #fff; }
    .badge.COOLING { background: #2563eb; color: #fff; }
    .badge.FAULT { background: var(--danger); color: #fff; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

    .temp-display { text-align: center; margin: 16px 0; }
    .current-temp { font-size: 3.5rem; font-weight: 800; color: #fff; line-height: 1; text-shadow: 0 0 30px var(--primary-glow); }
    .target-temp { color: var(--muted); font-size: 0.95rem; margin-top: 6px; }

    .slider-group { display: flex; align-items: center; gap: 12px; margin: 12px 0; }
    .step-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border); background: #262830; color: #fff; font-size: 1.5rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .step-btn:active { background: var(--primary); }
    input[type=range] { flex: 1; -webkit-appearance: none; height: 8px; background: #2e3039; border-radius: 4px; outline: none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--primary); cursor: pointer; }

    .duty-bar-container { background: #262830; border-radius: 8px; height: 10px; overflow: hidden; margin-top: 8px; }
    .duty-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #ff9900, #ff4400); transition: width 0.3s; }

    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
    .btn { padding: 12px; border-radius: 12px; font-weight: 600; font-size: 0.95rem; border: none; cursor: pointer; text-align: center; }
    .btn-power { background: #2e3039; color: #fff; }
    .btn-power.on { background: var(--primary); color: #fff; box-shadow: 0 0 15px var(--primary-glow); }
    .btn-reset { background: #3b2020; color: #ff8888; border: 1px solid #662222; }

    canvas { width: 100%; height: 130px; margin-top: 12px; background: #17181c; border-radius: 8px; }
    .section-title { font-size: 0.9rem; font-weight: 600; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }

    .setting-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #262830; font-size: 0.9rem; }
    .setting-item input[type=number] { width: 64px; background: #262830; border: 1px solid var(--border); color: #fff; border-radius: 6px; padding: 4px 8px; text-align: center; }
    .banner { padding: 12px; border-radius: 10px; background: #5c1414; color: #ffcccc; margin-bottom: 10px; font-size: 0.85rem; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div id="faultBanner" class="banner"></div>

    <div class="card">
      <div class="header">
        <div class="title">🔥 Lava Lamp</div>
        <div id="stateBadge" class="badge OFF">OFF</div>
      </div>

      <div class="temp-display">
        <div id="currentTemp" class="current-temp">--.-°</div>
        <div id="targetText" class="target-temp">Heater Power: 100 %</div>
        <div id="cutoffInfo" style="font-size: 0.75rem; color: var(--muted); margin-top: 2px;">DS18B20 Telemetry (Cutoff: 200°C)</div>
      </div>

      <div class="slider-group">
        <button class="step-btn" onclick="adjustPower(-5)">-5</button>
        <input type="range" id="powerSlider" min="0" max="100" step="5" value="100" onchange="sendPower(this.value)" oninput="updatePowerText(this.value)">
        <button class="step-btn" onclick="adjustPower(5)">+5</button>
      </div>

      <div style="display:flex; gap:6px; margin: 4px 0 10px 0;">
        <button class="btn btn-power" style="flex:1; padding:8px 4px; font-size:0.85rem;" onclick="setPowerPreset(25)">25%</button>
        <button class="btn btn-power" style="flex:1; padding:8px 4px; font-size:0.85rem;" onclick="setPowerPreset(50)">50%</button>
        <button class="btn btn-power" style="flex:1; padding:8px 4px; font-size:0.85rem;" onclick="setPowerPreset(75)">75%</button>
        <button class="btn btn-power" style="flex:1; padding:8px 4px; font-size:0.85rem;" onclick="setPowerPreset(100)">100%</button>
      </div>

      <div style="display:flex; justify-content:space-between; font-size:0.8rem; color:var(--muted); margin-top:8px;">
        <span>Heater Duty</span>
        <span id="dutyText">0 %</span>
      </div>
      <div class="duty-bar-container">
        <div id="dutyBar" class="duty-bar"></div>
      </div>

      <div class="btn-row">
        <button id="powerBtn" class="btn btn-power" onclick="togglePower()">Power ON</button>
        <button id="resetBtn" class="btn btn-reset" onclick="resetFault()">Clear Fault</button>
      </div>

      <canvas id="chartCanvas"></canvas>
    </div>

    <div class="card">
      <div class="section-title">Heating Profile</div>
      <div style="display:flex; gap:8px; margin-bottom:14px;">
        <button class="btn btn-power" style="flex:1;" onclick="setPattern('calm')">Calm (50°)</button>
        <button class="btn btn-power" style="flex:1;" onclick="setPattern('lively')">Lively</button>
        <button class="btn btn-power" style="flex:1;" onclick="setPattern(null)">Manual</button>
      </div>

      <div class="section-title">LED Ring Lighting</div>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:12px;">
        <button class="btn btn-power" onclick="setPalette('status')">Auto (Status)</button>
        <button class="btn btn-power" onclick="setPalette('lava')">Lava Glow</button>
        <button class="btn btn-power" onclick="setPalette('rainbow')">Rainbow</button>
        <button class="btn btn-power" onclick="setPalette('white')">Warm White</button>
      </div>
      <div class="setting-item">
        <span>LED Brightness (max 80%)</span>
        <input type="range" id="brightSlider" min="10" max="80" step="5" value="40" style="width:140px;" onchange="setBrightness(this.value)">
      </div>
    </div>

    <div class="card">
      <div class="section-title">PID & Diagnostics</div>
      <div class="setting-item"><span>Kp</span><input id="pidKp" type="number" step="0.5"></div>
      <div class="setting-item"><span>Ki</span><input id="pidKi" type="number" step="0.01"></div>
      <div class="setting-item"><span>Kd</span><input id="pidKd" type="number" step="1"></div>
      <button class="btn btn-power" style="width:100%; margin-top:8px;" onclick="savePid()">Save PID Gains</button>
      <div class="setting-item" style="margin-top:8px;"><span>IP Address</span><span id="devIp">--</span></div>
      <div class="setting-item"><span>Uptime</span><span id="devUptime">--</span></div>
    </div>
  </div>

  <script>
    let token = localStorage.getItem("ll_token") || "lavalamp-token-9349fi4j34489";
    let isPowered = false;
    let history = [];
    let limitsMin = 45;
    let limitsMax = 100;

    function authHeaders() {
      return { "Content-Type": "application/json", "Authorization": "Bearer " + token };
    }

    async function api(path, method = "GET", body = null) {
      try {
        const opts = { method, headers: authHeaders() };
        if (body) opts.body = JSON.stringify(body);
        const res = await fetch(path, opts);
        if (res.status === 401) {
          const t = prompt("Enter dashboard access token:");
          if (t) {
            token = t;
            localStorage.setItem("ll_token", t);
          }
          return null;
        }
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    function updatePowerText(val) {
      document.getElementById("targetText").innerText = `Heater Power: ${parseInt(val)} %`;
    }

    function adjustPower(delta) {
      const el = document.getElementById("powerSlider");
      let v = parseInt(el.value) + delta;
      v = Math.max(0, Math.min(100, v));
      el.value = v;
      updatePowerText(v);
      sendPower(v);
    }

    function setPowerPreset(val) {
      const el = document.getElementById("powerSlider");
      el.value = val;
      updatePowerText(val);
      sendPower(val);
    }

    async function sendPower(val) {
      await api("/api/power-level", "POST", { power_pct: parseFloat(val) });
    }

    async function togglePower() {
      await api("/api/power", "POST", { on: !isPowered });
      fetchStatus();
    }

    async function resetFault() {
      await api("/api/reset-fault", "POST");
      fetchStatus();
    }

    async function setPattern(name) {
      await api("/api/pattern/run", "POST", { name });
      fetchStatus();
    }

    async function setPalette(palette) {
      await api("/api/led", "POST", { palette });
      fetchStatus();
    }

    async function setBrightness(val) {
      await api("/api/led", "POST", { brightness: parseInt(val) });
    }

    async function savePid() {
      const kp = parseFloat(document.getElementById("pidKp").value);
      const ki = parseFloat(document.getElementById("pidKi").value);
      const kd = parseFloat(document.getElementById("pidKd").value);
      await api("/api/pid", "POST", { kp, ki, kd });
      alert("PID gains saved");
    }

    function drawChart() {
      const canvas = document.getElementById("chartCanvas");
      const ctx = canvas.getContext("2d");
      const dpr = window.devicePixelRatio || 1;
      canvas.width = canvas.clientWidth * dpr;
      canvas.height = canvas.clientHeight * dpr;
      ctx.scale(dpr, dpr);
      const w = canvas.clientWidth, h = canvas.clientHeight;
      ctx.clearRect(0, 0, w, h);
      if (history.length < 2) return;

      const minT = 20, maxT = 125;
      ctx.strokeStyle = "#333";
      ctx.beginPath();
      ctx.moveTo(0, h * 0.5); ctx.lineTo(w, h * 0.5);
      ctx.stroke();

      ctx.strokeStyle = "#ff5e3a";
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < history.length; i++) {
        const x = (i / (history.length - 1)) * w;
        const y = h - ((history[i].temp - minT) / (maxT - minT)) * h;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    async function fetchStatus() {
      const data = await api("/api/status");
      if (!data) return;


      document.getElementById("currentTemp").innerText = data.temp !== null ? `${data.temp.toFixed(1)}°` : "--.-°";
      const pLvl = data.power_pct !== undefined ? data.power_pct : (data.setpoint || 100);
      document.getElementById("targetText").innerText = `Heater Power: ${Math.round(pLvl)} %`;
      document.getElementById("powerSlider").value = pLvl;

      document.getElementById("dutyText").innerText = `${Math.round(data.duty)} %`;
      document.getElementById("dutyBar").style.width = `${data.duty}%`;

      const badge = document.getElementById("stateBadge");
      badge.className = `badge ${data.state}`;
      badge.innerText = data.state;

      isPowered = data.power;
      const pBtn = document.getElementById("powerBtn");
      pBtn.className = isPowered ? "btn btn-power on" : "btn btn-power";
      pBtn.innerText = isPowered ? "Power OFF" : "Power ON";

      const fb = document.getElementById("faultBanner");
      if (data.fault) {
        fb.style.display = "block";
        fb.innerText = "FAULT: " + data.fault;
      } else {
        fb.style.display = "none";
      }

      if (data.temp !== null) {
        history.push({ temp: data.temp, duty: data.duty });
        if (history.length > 60) history.shift();
        drawChart();
      }

      document.getElementById("devIp").innerText = data.ip || "--";
      document.getElementById("devUptime").innerText = `${Math.floor(data.uptime / 60)} min`;
      if (!document.getElementById("pidKp").value && data.pid) {
        document.getElementById("pidKp").value = data.pid.kp;
        document.getElementById("pidKi").value = data.pid.ki;
        document.getElementById("pidKd").value = data.pid.kd;
      }
    }

    setInterval(fetchStatus, 1500);
    fetchStatus();
  </script>
</body>
</html>
