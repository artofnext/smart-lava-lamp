<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Lava Lamp</title>
  <style>
    :root {
      --bg: #121316;
      --card: #1c1d22;
      --border: #2e3039;
      --primary: #ff5e3a;
      --primary-glow: rgba(255, 94, 58, 0.3);
      --text: #e8eaed;
      --muted: #9aa0a6;
      --danger: #ff4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .header { display: flex; justify-content: space-between; align-items: center; }
    .title { font-size: 1.25rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; background: #333; color: #ccc; }
    .badge.OFF { background: #333; color: #888; }
    .badge.HEATING { background: #d97706; color: #fff; }
    .badge.COOLING { background: #2563eb; color: #fff; }
    .badge.FAULT { background: var(--danger); color: #fff; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

    .temp-display { text-align: center; margin: 16px 0; }
    .current-temp { font-size: 3.5rem; font-weight: 800; color: #fff; line-height: 1; text-shadow: 0 0 30px var(--primary-glow); }
    .target-temp { color: var(--muted); font-size: 0.95rem; margin-top: 6px; }

    .slider-group { display: flex; align-items: center; gap: 12px; margin: 12px 0; }
    .step-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border); background: #262830; color: #fff; font-size: 1.1rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .step-btn:active { background: var(--primary); }
    input[type=range] { flex: 1; -webkit-appearance: none; height: 8px; background: #2e3039; border-radius: 4px; outline: none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--primary); cursor: pointer; }

    .duty-bar-container { background: #262830; border-radius: 8px; height: 10px; overflow: hidden; margin-top: 8px; }
    .duty-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #ff9900, #ff4400); transition: width 0.3s; }

    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
    .btn { padding: 12px; border-radius: 12px; font-weight: 600; font-size: 0.95rem; border: none; cursor: pointer; text-align: center; }
    .btn-power { background: #2e3039; color: #fff; }
    .btn-power.on { background: var(--primary); color: #fff; box-shadow: 0 0 15px var(--primary-glow); }
    .btn-power:disabled { opacity: 0.65; cursor: not-allowed; }
    .btn-reset { background: #3b2020; color: #ff8888; border: 1px solid #662222; }
    .row-between { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; font-size: 0.9rem; }
    input[type=color] { width: 52px; height: 34px; border: 1px solid var(--border); border-radius: 8px; background: #262830; cursor: pointer; padding: 2px; }

    canvas { width: 100%; height: 140px; margin-top: 14px; background: #17181c; border-radius: 8px; }
    .meta-row { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--muted); margin-top: 12px; padding-top: 10px; border-top: 1px solid #262830; }
    .banner { padding: 12px; border-radius: 10px; background: #5c1414; color: #ffcccc; font-size: 0.85rem; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div id="faultBanner" class="banner"></div>

    <div class="card">
      <div class="header">
        <div class="title">🔥 Lava Lamp</div>
        <div id="stateBadge" class="badge OFF">OFF</div>
      </div>

      <div class="temp-display">
        <div id="currentTemp" class="current-temp">--.-°</div>
        <div id="targetText" class="target-temp">Heater Power: 100 %</div>
        <div id="cutoffInfo" style="font-size: 0.75rem; color: var(--muted); margin-top: 2px;">DS18B20 Telemetry (Cutoff: 100°C)</div>
      </div>

      <div class="slider-group">
        <button class="step-btn" onclick="adjustPower(-5)">-5</button>
        <input type="range" id="powerSlider" min="0" max="100" step="5" value="100" onchange="sendPower(this.value)" oninput="updatePowerText(this.value)">
        <button class="step-btn" onclick="adjustPower(5)">+5</button>
      </div>

      <div style="display:flex; gap:6px; margin: 4px 0 10px 0;">
        <button class="btn btn-power" style="flex:1; padding:8px 4px; font-size:0.85rem;" onclick="setPowerPreset(25)">25%</button>
        <button class="btn btn-power" style="flex:1; padding:8px 4px; font-size:0.85rem;" onclick="setPowerPreset(50)">50%</button>
        <button class="btn btn-power" style="flex:1; padding:8px 4px; font-size:0.85rem;" onclick="setPowerPreset(75)">75%</button>
        <button class="btn btn-power" style="flex:1; padding:8px 4px; font-size:0.85rem;" onclick="setPowerPreset(100)">100%</button>
      </div>

      <div style="display:flex; justify-content:space-between; font-size:0.8rem; color:var(--muted); margin-top:8px;">
        <span>Heater Duty</span>
        <span id="dutyText">0 %</span>
      </div>
      <div class="duty-bar-container">
        <div id="dutyBar" class="duty-bar"></div>
      </div>

      <div class="btn-row">
        <button id="powerBtn" class="btn btn-power" onclick="togglePower()">Heater ON</button>
        <button id="resetBtn" class="btn btn-reset" onclick="resetFault()">Clear Fault</button>
      </div>

      <canvas id="chartCanvas"></canvas>

      <div class="meta-row">
        <span>IP: <strong id="devIp">--</strong></span>
        <span>Uptime: <strong id="devUptime">--</strong></span>
      </div>
    </div>

    <div class="card">
      <div class="header">
        <div class="title">💡 LED Ring</div>
        <button id="ledPowerBtn" class="btn btn-power" style="padding: 6px 14px; font-size: 0.85rem;" onclick="toggleLed()">LED ON</button>
      </div>

      <div class="row-between">
        <span style="color: var(--muted);">Brightness (<span id="ledBriVal">50</span>%)</span>
        <input type="range" id="ledBriSlider" min="5" max="80" step="5" value="50" oninput="document.getElementById('ledBriVal').innerText=this.value" onchange="updateLed({brightness: parseInt(this.value)})">
      </div>

      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-top:14px;">
        <button id="modeSolid" class="btn btn-power" style="padding:10px 6px; font-size:0.85rem;" onclick="updateLed({mode:'solid'})">Solid</button>
        <button id="modeTemp" class="btn btn-power" style="padding:10px 6px; font-size:0.85rem;" onclick="updateLed({mode:'temp'})">Temp</button>
        <button id="modeRainbow" class="btn btn-power" style="padding:10px 6px; font-size:0.85rem;" onclick="updateLed({mode:'rainbow'})">Rainbow</button>
        <button id="modeFlame" class="btn btn-power" style="padding:10px 6px; font-size:0.85rem;" onclick="updateLed({mode:'flame'})">🔥 Flame</button>
      </div>

      <div id="solidControls" class="row-between" style="display:none;">
        <span style="color: var(--muted);">Solid Color</span>
        <input type="color" id="ledColorPicker" value="#ff3c00" onchange="onColorChange(this.value)">
      </div>

      <div id="tempControls" class="row-between" style="display:none; font-size:0.75rem; color:var(--muted); justify-content:center;">
        <span>≤10° White → 15° Green → 25° Blue → 40° Purple → 55° Orange → ≥60° Red</span>
      </div>

      <div id="rainbowControls" class="row-between" style="display:none;">
        <span style="color: var(--muted);">Animation Speed (<span id="ledSpdVal">30</span>%)</span>
        <input type="range" id="ledSpdSlider" min="1" max="100" step="1" value="30" oninput="document.getElementById('ledSpdVal').innerText=this.value" onchange="updateLed({speed: parseInt(this.value)})">
      </div>
    </div>
  </div>

  <script>
    const urlToken = new URLSearchParams(location.search).get("token");
    if (urlToken) localStorage.setItem("ll_token", urlToken);
    let token = localStorage.getItem("ll_token") || "";
    let authRejected = false;
    let isPowered = false;
    let ledOn = true;
    let history = [];
    const WINDOW_MS = 3600 * 1000; // 1 hour sliding window

    function authHeaders() {
      return { "Content-Type": "application/json", "Authorization": "Bearer " + token };
    }

    async function api(path, method = "GET", body = null) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 3000);
      try {
        const opts = { method, headers: authHeaders(), signal: ctrl.signal };
        if (body) opts.body = JSON.stringify(body);
        const res = await fetch(path, opts);
        if (res.status === 401) {
          const t = prompt("Unauthorized. Enter dashboard access token:");
          if (t !== null && t.trim() !== "") {
            token = t.trim();
            localStorage.setItem("ll_token", token);
            authRejected = false;
          } else {
            authRejected = true;
          }
          return null;
        }
        authRejected = false;
        return await res.json();
      } catch (e) {
        return null;
      } finally {
        clearTimeout(timer);
      }
    }

    function updatePowerText(val) {
      document.getElementById("targetText").innerText = `Heater Power: ${parseInt(val)} %`;
    }

    function adjustPower(delta) {
      const el = document.getElementById("powerSlider");
      let v = parseInt(el.value) + delta;
      v = Math.max(0, Math.min(100, v));
      el.value = v;
      updatePowerText(v);
      sendPower(v);
    }

    function setPowerPreset(val) {
      const el = document.getElementById("powerSlider");
      el.value = val;
      updatePowerText(val);
      sendPower(val);
    }

    async function sendPower(val) {
      await api("/api/power-level", "POST", { power_pct: parseFloat(val) });
    }

    async function togglePower() {
      await api("/api/power", "POST", { on: !isPowered });
      setTimeout(fetchStatus, 150);
    }

    async function resetFault() {
      await api("/api/reset-fault", "POST");
      fetchStatus();
    }

    async function updateLed(payload) {
      await api("/api/led", "POST", payload);
      fetchStatus();
    }

    function toggleLed() {
      if (isPowered) return;
      updateLed({ on: !ledOn });
    }

    function onColorChange(hex) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      updateLed({ color: [r, g, b] });
    }

    function rgbToHex(c) {
      return "#" + c.map(x => Math.max(0, Math.min(255, x)).toString(16).padStart(2, "0")).join("");
    }

    function syncLedUi(led, heaterPower) {
      if (!led) return;
      ledOn = heaterPower ? true : !!led.on;
      const lBtn = document.getElementById("ledPowerBtn");
      lBtn.disabled = !!heaterPower;
      lBtn.className = ledOn ? "btn btn-power on" : "btn btn-power";
      lBtn.innerText = heaterPower ? "ON (Heater)" : (ledOn ? "LED ON" : "LED OFF");

      const briSlider = document.getElementById("ledBriSlider");
      if (document.activeElement !== briSlider) {
        briSlider.value = led.brightness;
        document.getElementById("ledBriVal").innerText = led.brightness;
      }

      document.getElementById("modeSolid").className = led.mode === "solid" ? "btn btn-power on" : "btn btn-power";
      document.getElementById("modeTemp").className = led.mode === "temp" ? "btn btn-power on" : "btn btn-power";
      document.getElementById("modeRainbow").className = led.mode === "rainbow" ? "btn btn-power on" : "btn btn-power";
      document.getElementById("modeFlame").className = led.mode === "flame" ? "btn btn-power on" : "btn btn-power";

      document.getElementById("solidControls").style.display = led.mode === "solid" ? "flex" : "none";
      document.getElementById("tempControls").style.display = led.mode === "temp" ? "flex" : "none";
      document.getElementById("rainbowControls").style.display = (led.mode === "rainbow" || led.mode === "flame") ? "flex" : "none";

      const colorPicker = document.getElementById("ledColorPicker");
      if (Array.isArray(led.color) && document.activeElement !== colorPicker) {
        colorPicker.value = rgbToHex(led.color);
      }

      const spdSlider = document.getElementById("ledSpdSlider");
      if (document.activeElement !== spdSlider) {
        spdSlider.value = led.speed;
        document.getElementById("ledSpdVal").innerText = led.speed;
      }
    }

    function drawChart() {
      const canvas = document.getElementById("chartCanvas");
      const ctx = canvas.getContext("2d");
      const dpr = window.devicePixelRatio || 1;
      canvas.width = canvas.clientWidth * dpr;
      canvas.height = canvas.clientHeight * dpr;
      ctx.scale(dpr, dpr);
      const w = canvas.clientWidth, h = canvas.clientHeight;
      ctx.clearRect(0, 0, w, h);

      const minT = 10, maxT = 80, meltT = 63;
      const yMelt = h - ((meltT - minT) / (maxT - minT)) * h;
      ctx.strokeStyle = "#3f4354";
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(0, yMelt); ctx.lineTo(w, yMelt);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = "#6e737b";
      ctx.font = "10px sans-serif";
      ctx.fillText(`${maxT}°C`, 6, 12);
      ctx.fillText(`${meltT}°C`, 6, yMelt - 4);
      ctx.fillText(`${minT}°C`, 6, h - 6);
      ctx.fillText("-60m", 42, h - 6);
      ctx.fillText("now", w - 26, h - 6);

      if (history.length < 2) return;

      const now = history[history.length - 1].t;
      const tStart = now - WINDOW_MS;

      ctx.strokeStyle = "#ff5e3a";
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < history.length; i++) {
        const x = Math.max(0, Math.min(w, ((history[i].t - tStart) / WINDOW_MS) * w));
        const y = h - ((history[i].temp - minT) / (maxT - minT)) * h;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    async function loadInitialHistory() {
      const data = await api("/api/history");
      if (data && Array.isArray(data.temps) && data.temps.length) {
        const now = Date.now();
        const stepMs = (data.interval_s || 10) * 1000;
        const n = data.temps.length;
        history = data.temps.map((temp, i) => ({
          t: now - (n - 1 - i) * stepMs,
          temp
        }));
        drawChart();
      }
    }

    async function fetchStatus() {
      const data = await api("/api/status");
      if (!data) return;

      if (data.limits && data.limits.cutoff) {
        document.getElementById("cutoffInfo").innerText = `DS18B20 Telemetry (Cutoff: ${data.limits.cutoff}°C)`;
      }

      document.getElementById("currentTemp").innerText = data.temp !== null ? `${data.temp.toFixed(1)}°` : "--.-°";
      const pLvl = data.power_pct !== undefined ? data.power_pct : 100;
      document.getElementById("targetText").innerText = `Heater Power: ${Math.round(pLvl)} %`;
      document.getElementById("powerSlider").value = pLvl;

      document.getElementById("dutyText").innerText = `${Math.round(data.duty)} %`;
      document.getElementById("dutyBar").style.width = `${data.duty}%`;

      const badge = document.getElementById("stateBadge");
      badge.className = `badge ${data.state}`;
      badge.innerText = data.state;

      isPowered = data.power;
      const pBtn = document.getElementById("powerBtn");
      pBtn.className = isPowered ? "btn btn-power on" : "btn btn-power";
      pBtn.innerText = isPowered ? "Heater OFF" : "Heater ON";

      const fb = document.getElementById("faultBanner");
      if (data.fault) {
        fb.style.display = "block";
        fb.innerText = "FAULT: " + data.fault;
      } else {
        fb.style.display = "none";
      }

      if (data.temp !== null) {
        const now = Date.now();
        history.push({ t: now, temp: data.temp });
        const cutoffTime = now - WINDOW_MS;
        while (history.length > 0 && history[0].t < cutoffTime) {
          history.shift();
        }
        drawChart();
      }

      document.getElementById("devIp").innerText = data.ip || "--";
      document.getElementById("devUptime").innerText = `${Math.floor(data.uptime / 60)} min`;
      syncLedUi(data.led, data.power);
    }

    async function pollLoop() {
      if (!authRejected) {
        await fetchStatus();
      }
      setTimeout(pollLoop, 2000);
    }

    fetchStatus().then(async () => {
      if (!authRejected) {
        await loadInitialHistory();
      }
      setTimeout(pollLoop, 2000);
    });
  </script>
</body>
</html>
